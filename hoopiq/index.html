function weekMonday(){

}

function computeFit(pick,drop){

function getNamesFromText(raw){
 const lines=String(raw||"").split(/[\r\n,;\t]+/).map(s=>s.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()).filter(Boolean).slice(0,160);
 const full=[...lines,...lines.slice(0,-1).map((x,i)=>x+" "+lines[i+1])];
 const unique=new Map();
 for(const player of [...nbaPlayers,...players]){
  const name=player.name.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
  if(name.length>=5&&!unique.has(name))unique.set(name,player);
 }
 return [...unique].filter(([n])=>{
 const parts=n.split(" "),rev=parts.length>1?parts.slice(1).join(" ")+" "+parts[0]:n;
 return full.some(line=>(" "+line+" ").includes(" "+n+" ")||(" "+line+" ").includes(" "+rev+" "));
}).map(([n,p])=>({id:p.id,name:p.name,team:p.team})).slice(0,80);
}

 imageReview.selected=new Set(imageReview.names.map(x=>x.id));

}
async function scanYahooPhoto(file,target="waiver"){
 if(!file||imageReview.busy)return;
 imageReview.target=target;
 if(!file.type?.startsWith("image/")){imageReview.error="Select a screenshot image.";render();return}
 if(file.size>15*1024*1024){imageReview.error="Choose an image smaller than 15 MB.";render();return}
 imageReview.error="";imageReview.busy=true;imageReview.names=[];
 if(imageReview.preview){URL.revokeObjectURL(imageReview.preview);imageReview.preview=""}
 imageReview.preview=URL.createObjectURL(file);render();
 let worker;
 try{
  if(!window.Tesseract){
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");script.async=true;
    script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.onload=resolve;script.onerror=()=>reject(Error("OCR library download failed"));
    document.head.appendChild(script);
   });
  }
  if(!window.Tesseract)throw Error("Image reader could not start");
  worker=await window.Tesseract.createWorker("eng",1,{logger:m=>{
   const el=document.getElementById("yahooOCRstatus");
   if(el&&m.progress!=null)el.textContent="Reading screenshot locally… "+Math.round(m.progress*100)+"%";
  }});
  const value=await worker.recognize(file);
  suggestPhotoNames(value?.data?.text||"",target);
 }catch(e){
  imageReview.error="Image scanning unavailable: "+String(e.message||e)+". You can still paste or search player names.";
  imageReview.busy=false;render();
 }finally{if(worker)try{await worker.terminate()}catch(e){}}
}

 evaluated.sort((a,b)=>order==="usable"?(b.calc.usable-a.calc.usable||b.calc.gain-a.calc.gain):

 (weekReady?'<div class="grid two">'+cardHtml+'</div>':('<div class="empty">'+(weekInfo.loading?"Getting this week's NBA slate...":esc(weekInfo.error||"Weekly schedule not loaded"))+'</div>'))+

if(a==="resetdraft"){if(confirm("Clear your demo draft picks?")){state.drafted=[];persist();render()}return}
if(a==="resetall"){if(confirm("Reset all settings stored on this device?")){localStorage.removeItem(storage);state=defaultState();render()}return}
if(a==="export"){const z={...state};delete z.selected;delete z.view;delete z.menu;delete z.search;const blob=new Blob([JSON.stringify(z,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="hoopiq-settings.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Settings exported");return}
if(a==="import"){$("importfile").click();return}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.dataset.reviewroster){const id=Number(t.dataset.reviewroster);if(t.checked)imageReview.selected.add(id);else imageReview.selected.delete(id);return}
 if(t.id==="rosterImportMode"){imageReview.replaceRoster=t.value==="replace";return}
 if(t.id==="rosterFile"&&t.files?.[0]){scanYahooPhoto(t.files[0],"roster");return}
if(t.dataset.reviewwaiver){const id=Number(t.dataset.reviewwaiver);if(t.checked)imageReview.selected.add(id);else imageReview.selected.delete(id);return}
if(t.id==="waiverFile"&&t.files?.[0]){scanYahooPhoto(t.files[0]);return}
if(t.id==="fitplayer"){state.fitPlayer=Number(t.value);persist();render();return}if(t.id==="fitdrop"){state.fitDrop=t.value;persist();render();return}if(t.id==="position"){state.position=t.value;render()}
if(t.id==="waiverdrop"){state.fitDrop=t.value;persist();render();return}if(t.id==="waivermode"){state.waiverMode=t.value;persist();render();return}if(t.id==="sort"){state.sort=t.value;render()}
if(t.id==="addroster"&&t.value){const id=Number(t.value);if(!state.roster.includes(id)){state.roster.push(id);const player=nbaPlayers.find(p=>p.id===id);if(player)state.cachePlayers={...(state.cachePlayers||{}),[id]:player}}state.manualQuery="";persist();render()}
if(t.dataset.trade&&t.value){const id=Number(t.value);if(!state.give.includes(id)&&!state.get.includes(id)){state[t.dataset.trade].push(id);persist()}render()}
if(t.id==="importfile"&&t.files&&t.files[0]){const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(!o||typeof o!=="object"||!Array.isArray(o.roster)||!o.scoring)throw Error("invalid");state={...defaultState(),...o,view:"settings",selected:null,menu:false,search:"",scoring:{...defs,...o.scoring}};state.roster=state.roster.map(Number).filter(x=>P(x)).slice(0,27);state.watch=Array.isArray(state.watch)?state.watch.map(Number).filter(x=>P(x)):[];state.drafted=Array.isArray(state.drafted)?state.drafted.map(Number).filter(x=>P(x)):[];persist();render();toast("Imported settings")}catch(e){alert("Could not import this HoopIQ settings file")}};reader.readAsText(t.files[0])}
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="waiverQuery"){const pos=t.selectionStart;state.waiverQuery=t.value;render();const el=$("waiverQuery");if(el){el.focus();el.setSelectionRange(pos,pos)}return}
if(t.id==="manualquery"){const caret=t.selectionStart;state.manualQuery=t.value;render();const field=$("manualquery");if(field){field.focus();field.setSelectionRange(caret,caret)}return}if(t.id==="playersearch"){const a=t.selectionStart;state.search=t.value;render();const input=$("playersearch");if(input){input.focus();input.setSelectionRange(a,a)}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.selected){state.selected=null;render()}});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
updateNBA();updateScores();loadWeek();setInterval(updateNBA,20*60*1000);setInterval(updateScores,60*1000);
})();
