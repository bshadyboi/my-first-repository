function computeFit(pick,drop){
 const old=fantasyActiveRoster(),next=old.filter(p=>!drop||normalizeName(p.name)!==normalizeName(drop.name));
 if(pick)next.push(pick);
 const cap=lineupCapacity();
 let oldTotal=0,newTotal=0,usable=0,blocked=0,games=0;
 const days=Array.from({length:7},(_,i)=>{
  const date=weekDate(state.weekStart||weekMonday(),i);
  const schedule=all=>all.flatMap(p=>weekGame(p,date).map(g=>({name:p.name,value:fp(p)}))).sort((a,b)=>b.value-a.value);
  const before=schedule(old),after=schedule(next),oldActive=before.slice(0,cap),newActive=after.slice(0,cap);
  const original=oldActive.reduce((a,x)=>a+x.value,0),updated=newActive.reduce((a,x)=>a+x.value,0);
  const available=pick?after.filter(x=>normalizeName(x.name)===normalizeName(pick.name)).length:0;
  const used=pick?newActive.filter(x=>normalizeName(x.name)===normalizeName(pick.name)).length:0;
  oldTotal+=original;newTotal+=updated;usable+=used;blocked+=available-used;games+=available;
  return {date,change:updated-original,available,used,blocked:available-used,occupied:oldActive.length};
 });

}

async function applyPersonalRosterLink(){
 if(!pendingPersonalRoster||personalRosterBusy)return;
 const applyMine=$("personalApplyMine")?.checked!==false;
 const applyOpponent=!!pendingPersonalRoster.opponentPlayers?.length&&$("personalApplyOpponent")?.checked!==false;
 if(!applyMine&&!applyOpponent){personalRosterError="Select at least one team to apply.";render();return}
 const own=applyMine?pendingPersonalRoster.players:[];
 const other=applyOpponent?pendingPersonalRoster.opponentPlayers:[];
 if(applyMine&&state.manualRoster&&(state.roster||[]).length&&!confirm("Replace your current My Team roster with the "+own.length+" players from your screenshot? Your opponent and other settings will not be cleared."))return;
 personalRosterBusy=true;personalRosterError="";render();
 try{
  const imported=[...own,...other];
  if(!nbaPlayers.length)await updateNBA();
  const matched=new Map(),unresolved=[];
  const byId=id=>nbaPlayers.find(p=>Number(p.id)===id);
  const check=(record,item)=>record&&Number(record.id)===item.id&&normalizeName(record.name)===normalizeName(item.name)&&normalizeTeam(record.team)===normalizeTeam(item.team);
  for(const item of imported){
   const existing=matched.get(item.id)||byId(item.id)||state.cachePlayers?.[item.id];
   if(check(existing,item))matched.set(item.id,existing);else unresolved.push(item);
  }
  const teams=[...new Set(unresolved.map(item=>item.team))];
  const fromRosters=new Map();
  await Promise.all(teams.map(async team=>{
   try{
    const response=await fetch("/api/nba?resource=roster&team="+encodeURIComponent(team),{cache:"no-store"});
    if(!response.ok)return;
    const data=await response.json();
    if(!data.ok)return;
    for(const record of (data.data?.athletes||[]).flatMap(x=>Array.isArray(x.items)?x.items:[x])){
     const id=Number(record.id);
     if(!Number.isSafeInteger(id)||!record.displayName)continue;
     fromRosters.set(id,{id,name:record.displayName,team,pos:record.position?.abbreviation||"UTIL",
      pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,threes:0,games:0,own:0,available:false,source:"roster",statsUnavailable:true});
    }
   }catch(e){}
  }));
  for(const item of unresolved){
   const p=fromRosters.get(item.id);
   if(check(p,item))matched.set(item.id,p);
  }
  const notFound=imported.filter(item=>!matched.has(item.id));
  if(notFound.length)throw Error("Could not verify: "+notFound.map(p=>p.name).join(", ")+". No changes saved. Try again when the NBA feed is available.");
  // Atomic write: every requested player was validated before touching saved rosters.
  const nextCache={...(state.cachePlayers||{})};
  for(const [id,p] of matched)nextCache[id]=p;
  if(applyMine){
   state.roster=own.map(p=>p.id);
   state.rosterPositions=Object.fromEntries(own.map(p=>[p.id,p.slot]));
   state.lineupSlots=[...window.HoopIQLineup.DEFAULT];state.lineupCount=10;
   state.manualRoster=true;state.fitDrop="";state.importOpen=false;
  }
  if(applyOpponent){
   const keep=Array.isArray(state.opponentRoster)?state.opponentRoster:[];
   const next=[...new Set([...other.map(p=>p.id),...keep])];
   let assignments={...(state.opponentPositions||{})};
   // New starter slots take priority; existing opponent players are never deleted.
   for(const player of other){
    assignments=window.HoopIQLineup.move(next,assignments,player.id,player.slot,currentLineupSlots());
   }
   state.opponentRoster=next;
   state.opponentPositions=assignments;
   state.opponent= pendingPersonalRoster.opponentName;
   state.opponentManual=true;state.opponentImportOpen=false;
  }
  state.cachePlayers=nextCache;
  state.view=applyOpponent?"opponent":"league";
  dismissPersonalRosterLink();persist();render();
  toast((applyMine?"My Team":"")+(applyMine&&applyOpponent?" and ":"")+(applyOpponent?"Opponent":"")+" saved in HoopIQ");
 }catch(e){
  personalRosterError=String(e.message||e);
 }finally{
  personalRosterBusy=false;render();
 }
}

async function loadRosterForOCR(text){

 // A failed lookup is retryable on the next scan.

async function imageForYahooOCR(file){
 if(typeof createImageBitmap!=="function")return null;
 let bmp;try{bmp=await createImageBitmap(file)}catch(e){return null}
 try{
  const left=Math.round(bmp.width*0.19),top=Math.round(bmp.height*0.12);
  const width=Math.round(bmp.width*0.68),height=Math.round(bmp.height*0.81);
  const scale=Math.min(2.8,1600/width,3400/height);
  const canvas=document.createElement("canvas");
  canvas.width=Math.max(1,Math.round(width*scale));canvas.height=Math.max(1,Math.round(height*scale));
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(bmp,left,top,width,height,0,0,canvas.width,canvas.height);
  const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);
  let average=0;const values=pixels.data;
  for(let i=0;i<values.length;i+=160)average+=(values[i]+values[i+1]+values[i+2])/3;
  average/=Math.ceil(values.length/160);
  const dark=average<125;
  for(let i=0;i<values.length;i+=4){
   const luminance=values[i]*.299+values[i+1]*.587+values[i+2]*.114;
   const out=dark?(luminance>116?20:255):(luminance<150?20:255);
   values[i]=values[i+1]=values[i+2]=out;
  }
  ctx.putImageData(pixels,0,0);
  return canvas;
 }finally{bmp.close?.()}
}

async function scanYahooPhotos(fileList,target="waiver"){

 const incoming=Array.from(fileList||[]);
 if(!incoming.length)return;
 let failed=0,accepted=[];
 const room=Math.max(0,12-imageReview.scans.length);
 for(const file of incoming.slice(0,room)){
  if(!file.type?.startsWith("image/")||file.size>15*1024*1024){failed++;continue}
  accepted.push({id:"image-"+(++imageScanSeq),name:file.name||"Screenshot",file,status:"queued",error:"",text:"",preview:URL.createObjectURL(file)});
 }
 if(incoming.length>room)failed+=incoming.length-room;
 if(!accepted.length){imageReview.error=room===0?"Maximum 12 screenshots per import. Remove an image or confirm this batch first.":"Select image files smaller than 15 MB.";render();return}
 imageReview.scans.push(...accepted);
 imageReview.busy=true;imageReview.error=failed?failed+" images were skipped (limit 12 total and 15 MB each).":"";
 render();
 let worker;
 try{
  if(!window.Tesseract){
   await new Promise((resolve,reject)=>{
    const script=document.createElement("script");script.async=true;
    script.src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    script.onload=resolve;script.onerror=()=>reject(Error("OCR library download failed"));
    document.head.appendChild(script);
   });
  }
  worker=await window.Tesseract.createWorker("eng",1,{logger:m=>{
   const node=$("yahooOCRstatus");if(node&&m.progress!=null&&imageReview.busy)node.textContent=imageReview.progress+" · "+Math.round(m.progress*100)+"%";
  }});
  await worker.setParameters({tessedit_pageseg_mode:"11"});
  if(nbaPlayers.length<200)await updateNBA();
  for(let i=0;i<accepted.length;i++){
   const scan=accepted[i];scan.status="scanning";
   imageReview.progress="Scanning "+(i+1)+" of "+accepted.length+" screenshots…";render();
   try{
    const cropped=await imageForYahooOCR(scan.file);
    const first=await worker.recognize(cropped||scan.file);
    let raw=String(first?.data?.text||"");
    if(matchOCRText(raw).matches.length<6){
     const extra=await worker.recognize(scan.file);
     raw+="\n"+String(extra?.data?.text||"");
    }
    if(!raw.trim())throw Error("No readable text; try a clearer screenshot");
    await loadRosterForOCR(raw);
    scan.text=raw.slice(0,25000);scan.status="done";
   }catch(e){scan.status="error";scan.error=String(e.message||e).slice(0,100)}
   scan.file=null;
   reconcileImageReview();render();
  }
 }catch(e){
  for(const scan of accepted)if(scan.status!=="done"&&scan.status!=="error"){scan.status="error";scan.error=String(e.message||e).slice(0,100);scan.file=null}

  if(worker)try{await worker.terminate()}catch(e){}
  imageReview.busy=false;imageReview.progress="";
  reconcileImageReview();
  if(!imageReview.names.length&&!imageReview.error)imageReview.error="No verified player names found. Edit the OCR text or upload additional screenshots.";
  render();
 }
}

async function submitCoachQuestion(text){

 state.coachHistory=state.coachHistory.slice(-18);persist();
 coachBusy=true;if(state.view==="coach")render();
 let answer="",source="Built-in strategy analysis";
 if(coachAIEnabled){
  try{
   const c=new AbortController(),timer=setTimeout(()=>c.abort(),12000);
   try{
    const resp=await fetch("/api/coach",{method:"POST",headers:{"Content-Type":"application/json"},
     body:JSON.stringify({question,context:coachContext()}),signal:c.signal});
    const data=await resp.json();
    if(!resp.ok||!data.ok)throw Error(data.error||"AI offline");
    answer=String(data.answer||"").slice(0,2200);
    source="AI-assisted analysis";
   }finally{clearTimeout(timer)}
  }catch(e){coachAIEnabled=false;answer="The AI service is unavailable, so here’s my built-in assessment:\n\n"+coachLocalAnswer(question)}
 }
 if(!answer)answer=coachLocalAnswer(question);
 state.coachHistory.push({role:"assistant",text:answer,source});
 state.coachHistory=state.coachHistory.slice(-18);
 coachBusy=false;persist();
 if(state.view==="coach"){render();$("coachMessages")?.scrollTo(0,$("coachMessages").scrollHeight);$("coachInput")?.focus()}
}

card("iPhone app and saved data",'<span class="pill">INSTALLABLE ON IPHONE</span><p class="muted">In Safari, open the hosted site, tap <b>Share → Add to Home Screen</b>, then launch HoopIQ from your iPhone like an app. No App Store required.</p><hr class="separator"/><b>Move your settings between devices</b><p class="muted small">Export your team, watchlist, scoring and draft choices, and import the file on a second device. Automatic syncing requires secure accounts and a backend.</p><div class="buttonrow">'+button("export","↓ Export settings","ghost xs")+button("import","↑ Import settings","ghost xs")+'</div><input id="importfile" type="file" accept=".json,application/json" hidden/><hr class="separator"/><b>Real NBA and Yahoo data</b><p class="muted small">Separate integrations are needed for real stats, news, injury feeds, schedules, Yahoo OAuth, and cross-device syncing.</p>'+button("status","Integration status","ghost xs"))+'</div>'+
'<div style="height:16px"></div>'+
card("Yahoo-style lineup configuration",
 '<p class="muted small">Match the number of starting spots in your league. Bench and Injured List players are tracked separately and do not count toward the starter total. Changing this template never deletes saved players.</p>'+
 '<div class="lineup-config">'+window.HoopIQLineup.LABELS.map(label=>'<label>'+label+'<input class="textinput" data-slot-count="'+label+'" type="number" min="0" max="6" step="1" value="'+currentLineupSlots().filter(x=>x===label).length+'"></label>').join("")+'</div>'+
 '<div class="buttonrow" style="margin-top:12px">'+button("saveLineupSlots","Save starter positions","primary xs")+button("league","Back to My Team","ghost xs")+'</div>')+
'<div style="height:16px"></div>'+card("Reset local preview",'<p class="muted">Clear all customizations and restore the initial demo team, watchlist and draft board.</p>'+button("resetall","Reset everything","danger"))}
function detail(){if(!state.selected)return "";const p=P(state.selected);if(!p)return "";return '<div class="modalbg" data-dismiss="yes"><div class="modal" role="dialog" aria-modal="true" aria-label="Player details"><button class="btn ghost close" data-action="close">×</button><div class="row">'+icon(p)+'<div><h2 style="margin:0">'+esc(p.name)+'</h2><div class="muted">'+p.team+' · '+p.pos+'</div></div></div><p><span class="pill demo">'+(p.source==='real'?'ESPN CURRENT-SEASON AVERAGES':'ILLUSTRATIVE PLAYER STAT LINE')+'</span></p><div class="grid three">'+metric("FP per game",f(fp(p)),"Custom scoring","◈")+metric("Games",p.games,p.source==="real"?"Season games played":"Demo week","▦")+metric(p.source==="real"?"Season FP":"Week FP",f(fp(p)*p.games),p.source==="real"?"Calculated total":"Example total","✧")+'</div><hr class="separator"/><div class="tablewrap"><table class="datatable"><thead><tr><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TOV</th></tr></thead><tbody><tr><td>'+f(p.pts)+'</td><td>'+f(p.reb)+'</td><td>'+f(p.ast)+'</td><td>'+f(p.stl)+'</td><td>'+f(p.blk)+'</td><td>'+f(p.tov)+'</td></tr></tbody></table></div><p class="muted small">The player record here is fictional seed data, not an updated profile. The calculator uses your selected point weights.</p><div class="buttonrow">'+button("watch",state.watch.includes(p.id)?"★ Remove watch":"☆ Add watch","primary",'data-id="'+p.id+'"')+button("close","Close","ghost")+'</div></div></div>'}
function matchupCtx(){return {state,imageReview,importBatchPanel,scanYahooPhotos,renderLineup,lineupCapacity,currentLineupSlots,P,players,nbaPlayers,normalizeName,weekDate,weekGame,weekControls,weekInfo,fp,f,esc,button,card,icon,sampleRoster,chosenWaivers,addDropSuggestions,suggestionCards,scheduleReady,scheduleNotice,persist,render,toast,scanYahooPhoto,suggestPhotoNames,clearImageReview,ocrReviewDiagnostics,route,$}}
function render(){let body=({dashboard,live,fit,yahoo,coach,league,opponent:()=>window.HoopIQMatchup.renderOpponent(matchupCtx()),matchup:()=>window.HoopIQMatchup.renderMatchup(matchupCtx()),rankings:()=>ranking(false),projections:()=>ranking(true),trade,waivers,matchups,draft,watchlist,settings}[state.view]||dashboard)();$("app").innerHTML=shell(body)+detail();}
function route(v){if(["fit","waivers","matchups","matchup","dashboard"].includes(v)){state.weekStart=state.weekStart||weekMonday();if(weekInfo.start!==state.weekStart)loadWeek()}state.view=v;state.search="";state.position="ALL";state.sort="fp";state.reverse=false;state.menu=false;state.selected=null;persist();render();window.scrollTo(0,0)}
function toast(msg){let existing=$("toast");if(existing)existing.remove();let el=document.createElement("div");el.className="toast";el.id="toast";el.textContent=msg;document.body.appendChild(el);setTimeout(()=>{if(el.isConnected)el.remove()},2800)}
document.addEventListener("click",e=>{
const nav=e.target.closest("[data-view]");if(nav){if(nav.dataset.view==="menu"){state.menu=!state.menu;render()}else route(nav.dataset.view);return}
const el=e.target.closest("[data-action]");if(!el){if(e.target.matches('[data-dismiss="yes"]')){state.selected=null;render()}return}
const a=el.dataset.action,id=Number(el.dataset.id);
if(window.HoopIQMatchup?.onClick(matchupCtx(),a,el))return;
if(["waivers","trade","league","settings","rankings","dashboard","matchups","matchup","opponent","fit","yahoo","coach"].includes(a)){route(a);return}
if(a==="rankings-view"||a==="waivers-view"){route(a==="rankings-view"?"rankings":"waivers");return}
if(a==="menu"){state.menu=!state.menu;render();return}
if(a==="watch"){state.watch=state.watch.includes(id)?state.watch.filter(x=>x!==id):[...state.watch,id];persist();render();toast("Watchlist updated");return}
if(a==="profile"){state.selected=id;render();return}
if(a==="close"){state.selected=null;render();return}
if(a==="status"){state.selected=null;alert("HoopIQ v0.1 is a functional preview with illustrative player data. Local player rankings, scoring, trade scenarios, draft picks, settings and the PWA shell work. Live NBA scores and season stats rely on an unofficial source. Injuries, Yahoo OAuth, accounts and true cross-device sync are NOT connected yet.");return}
if(a==="recheckOCR"){
 const scan=imageReview.scans.find(s=>s.id===el.dataset.scanid);
 if(!scan)return;
 const area=document.querySelector('[data-ocrtext="'+scan.id+'"]');
 const corrected=area?.value||"";
 scan.text=corrected.slice(0,25000);
 loadRosterForOCR(scan.text).then(()=>{reconcileImageReview();render()});
 return
}
if(a==="removeImageScan"){
 if(imageReview.busy)return;
 const index=imageReview.scans.findIndex(s=>s.id===el.dataset.scanid);
 if(index>=0){const [scan]=imageReview.scans.splice(index,1);if(scan.preview)URL.revokeObjectURL(scan.preview);reconcileImageReview();render()}
 return
}
if(a==="clearImageSession"){
 if(imageReview.busy)return;
 clearImageReview();render();toast("Scanned images cleared; saved rosters unchanged");return
}
if(a==="resolveImageAmbiguity"){
 const i=Number(el.dataset.index),a=imageReview.ambiguous[i];
 if(!a)return;
 const id=Number($("batchAmbig"+i)?.value);
 const p=nbaPlayers.find(x=>x.id===id)||players.find(x=>x.id===id)||state.cachePlayers?.[id];
 if(!p){toast("Choose a player first");return}
 if(!imageReview.manualMatches.some(x=>x.id===id))imageReview.manualMatches.push({id:p.id,name:p.name,team:p.team});
 imageReview.resolvedKeys.add(a.key);
 reconcileImageReview();
 imageReview.selected.add(id);
 render();toast("Name confirmed: "+p.name);return
}

if(a==="openRosterImport"){state.importOpen=!state.importOpen;persist();render();return}
if(a==="openWaiverImport"){state.waiverImportOpen=!state.waiverImportOpen;persist();render();return}
if(a==="teamManualToggle"){state.manualAddOpen=!state.manualAddOpen;persist();render();return}
if(a==="coachPrompt"){submitCoachQuestion(el.dataset.question||"");return}
if(a==="clearCoach"){state.coachHistory=[];persist();render();return}
if(a==="refreshnba"){updateNBA();updateScores();return}
if(a==="fitprev"||a==="fitnext"){state.weekStart=weekDate(state.weekStart||weekMonday(),a==="fitnext"?7:-7);persist();loadWeek(true);return}
if(a==="fitrefresh"){loadWeek(true);return}
if(a==="saveLineupSlots"){
 const chosen=[];
 document.querySelectorAll("[data-slot-count]").forEach(field=>{
  const label=field.dataset.slotCount;
  const count=Math.max(0,Math.min(6,Math.round(Number(field.value)||0)));
  if(window.HoopIQLineup.LABELS.includes(label))for(let i=0;i<count;i++)chosen.push(label);
 });
 if(!chosen.length){toast("Keep at least one starting position");return}
 if(chosen.length>30){toast("Maximum 30 starter slots");return}
 state.lineupSlots=chosen;state.lineupCount=chosen.length;
 persist();render();toast("Lineup positions saved. Unused players remain on your roster.");return
}
if(a==="fitcapacity"){toast("Edit starting positions under Settings");route("settings");return}
if(a==="fitodds"){state.fitOpp=$("fitopponent").value;persist();render();return}

if(a==="applyPersonalRoster"){applyPersonalRosterLink();return}
if(a==="cancelPersonalRoster"){dismissPersonalRosterLink();render();return}
if(a==="mystart"){if(confirm("Replace sample players with an empty manual roster? This does not change Yahoo.")){state.manualRoster=true;state.roster=[];state.rosterPositions={};state.cachePlayers={};state.fitDrop="";persist();render()}return}
if(a==="focusRosterSearch"){state.manualAddOpen=true;render();$("manualquery")?.focus();$("manualquery")?.scrollIntoView({behavior:"smooth",block:"center"});return}
if(a==="openRosterPhoto"){$("rosterFile")?.click();return}
if(a==="toggleRosterPaste"){state.rosterPasteOpen=!state.rosterPasteOpen;render();return}
if(a==="parseRosterPaste"){suggestPhotoNames($("rosterPaste")?.value||"","roster");return}
if(a==="cancelRosterScan"){clearImageReview();render();return}
if(a==="approveRosterScan"){
 if(imageReview.target!=="roster"||imageReview.busy)return;
 const ids=[...imageReview.selected].filter(id=>imageReview.names.some(p=>p.id===id));
 if(!ids.length){toast("Select at least one verified player");return}
 const replace=!state.manualRoster||imageReview.replaceRoster;
 if(replace&&state.manualRoster&&state.roster.length&&!confirm("Replace your entire HoopIQ roster?"))return;
 const next=replace?[]:[...(state.roster||[])];
 let nextPositions=replace?{}:{...(state.rosterPositions||{})};
 for(const id of ids){
  const player=nbaPlayers.find(p=>p.id===id)||players.find(p=>p.id===id)||state.cachePlayers?.[id];
  if(!player)continue;
  if(!next.includes(id))next.push(id);
  state.cachePlayers={...(state.cachePlayers||{}),[id]:player};
  const wanted=imageReview.positions?.[id];
  const isEdited=imageReview.positionEdited?.has(id);
  if(wanted&&(isEdited||!nextPositions[id])){
   nextPositions=window.HoopIQLineup.move(next,nextPositions,id,wanted,currentLineupSlots());
  }else if(!nextPositions[id])nextPositions[id]="UNASSIGNED";
 }
 state.roster=next;state.rosterPositions=nextPositions;state.manualRoster=true;state.fitDrop="";
 clearImageReview();persist();render();
 toast(ids.length+" players imported. Review their Yahoo slots below.");return
}

if(a==="suggestedFit"){state.fitPlayer=id;state.fitDrop=el.dataset.drop||"";persist();route("fit");return}
if(a==="pickfit"){state.fitPlayer=id;route("fit");return}

if(a==="openWaiverCamera"){$("waiverFile")?.click();return}
if(a==="toggleWaiverPaste"){state.pasteOpen=!state.pasteOpen;render();return}
if(a==="parseWaiverPaste"){suggestPhotoNames($("waiverPaste")?.value||"");return}
if(a==="cancelWaiverScan"){clearImageReview();render();return}
if(a==="approveWaiverScan"){
 if(imageReview.busy||imageReview.target!=="waiver")return;
 const ids=[...imageReview.selected].filter(id=>imageReview.names.some(p=>p.id===id)),pool=[...nbaPlayers,...players];
 if(!ids.length){toast("Select at least one verified player");return}
 state.waiverIds=[...new Set([...(state.waiverIds||[]),...ids])].slice(0,120);
 for(const id of ids){const player=pool.find(p=>p.id===id)||state.cachePlayers?.[id];if(player)state.cachePlayers={...(state.cachePlayers||{}),[id]:player}}
 clearImageReview();persist();render();toast(ids.length+" available players saved");return
}
if(a==="addKnownWaiver"){
 const player=nbaPlayers.find(p=>p.id===id)||players.find(p=>p.id===id);
 if(player){state.waiverIds=[...new Set([...(state.waiverIds||[]),id])].slice(0,120);state.cachePlayers={...(state.cachePlayers||{}),[id]:player};state.waiverQuery="";persist();render()}return
}
if(a==="removeKnownWaiver"){state.waiverIds=(state.waiverIds||[]).filter(x=>Number(x)!==id);persist();render();return}
if(a==="clearKnownWaivers"){if(confirm("Clear your saved Yahoo available players?")){state.waiverIds=[];persist();render()}return}
if(a==="reverse"){state.reverse=!state.reverse;render();return}
if(a==="savescoring"){document.querySelectorAll("[data-score]").forEach(x=>{let v=Number(x.value);if(Number.isFinite(v)&&Math.abs(v)<=100)state.scoring[x.dataset.score]=v});persist();render();toast("Scoring saved");return}
if(a==="resetscoring"){state.scoring={...defs};persist();render();toast("Default scoring restored");return}
if(a==="saveleague"){state.name=$("teamname").value.trim().slice(0,48)||"My Fantasy Team";state.league=$("leaguename").value.trim().slice(0,48)||"My League";persist();render();toast("League settings saved");return}
if(a==="addroster"){if(!state.roster.includes(id))state.roster.push(id);persist();render();toast("Added to demo team");return}
if(a==="removeroster"){state.roster=state.roster.filter(x=>x!==id);delete state.rosterPositions?.[id];persist();render();toast("Removed from HoopIQ only");return}
if(a==="removetrade"){const side=el.dataset.side;state[side]=state[side].filter(x=>x!==id);persist();render();return}
if(a==="draft"){state.drafted=state.drafted.includes(id)?state.drafted.filter(x=>x!==id):[...state.drafted,id];persist();render();return}
if(a==="resetdraft"){if(confirm("Clear your demo draft picks?")){state.drafted=[];persist();render()}return}
if(a==="resetall"){if(confirm("Reset all settings stored on this device?")){localStorage.removeItem(storage);state=defaultState();render()}return}
if(a==="export"){const z={...state};delete z.selected;delete z.view;delete z.menu;delete z.search;const blob=new Blob([JSON.stringify(z,null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="hoopiq-settings.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Settings exported");return}
if(a==="import"){$("importfile").click();return}
});
document.addEventListener("submit",e=>{if(e.target.id==="coachForm"){e.preventDefault();submitCoachQuestion($("coachInput")?.value||"")}});
document.addEventListener("change",e=>{const t=e.target;
if(window.HoopIQMatchup?.onChange(matchupCtx(),t))return;
 if(t.dataset.reviewroster){const id=Number(t.dataset.reviewroster);if(t.checked)imageReview.selected.add(id);else imageReview.selected.delete(id);return}
 if(t.id==="rosterImportMode"){imageReview.replaceRoster=t.value==="replace";return}
 if(t.dataset.lineupTeam&&t.dataset.lineupId){
 const kind=t.dataset.lineupTeam,id=Number(t.dataset.lineupId);
 applyLineupPosition(kind,id,t.value);toast("Lineup updated locally");return
}
if(t.dataset.fillTeam&&t.dataset.fillKey&&t.value){
 const kind=t.dataset.fillTeam,id=Number(t.value);
 applyLineupPosition(kind,id,t.dataset.fillKey);toast("Starter changed in HoopIQ");return
}
if(t.id==="rosterFile"&&t.files?.length){scanYahooPhotos(t.files,"roster");return}
if(t.dataset.importPosition){
 const id=Number(t.dataset.importPosition);
 imageReview.positions[id]=t.value;
 imageReview.positionEdited.add(id);
 return;
}
if(t.dataset.reviewwaiver){const id=Number(t.dataset.reviewwaiver);if(t.checked)imageReview.selected.add(id);else imageReview.selected.delete(id);return}
if(t.id==="waiverFile"&&t.files?.length){scanYahooPhotos(t.files,"waiver");return}
if(t.id==="fitplayer"){state.fitPlayer=Number(t.value);persist();render();return}if(t.id==="fitdrop"){state.fitDrop=t.value;persist();render();return}if(t.id==="position"){state.position=t.value;render()}
if(t.id==="waiverdrop"){state.fitDrop=t.value;persist();render();return}if(t.id==="waivermode"){state.waiverMode=t.value;persist();render();return}if(t.id==="sort"){state.sort=t.value;render()}
if(t.id==="addroster"&&t.value){const id=Number(t.value);if(!state.roster.includes(id)){state.roster.push(id);state.rosterPositions={...(state.rosterPositions||{}),[id]:"BN"};const player=nbaPlayers.find(p=>p.id===id);if(player)state.cachePlayers={...(state.cachePlayers||{}),[id]:player}}state.manualQuery="";persist();render()}
if(t.dataset.trade&&t.value){const id=Number(t.value);if(!state.give.includes(id)&&!state.get.includes(id)){state[t.dataset.trade].push(id);persist()}render()}
if(t.id==="importfile"&&t.files&&t.files[0]){const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(!o||typeof o!=="object"||!Array.isArray(o.roster)||!o.scoring)throw Error("invalid");state={...defaultState(),...o,view:"settings",selected:null,menu:false,search:"",scoring:{...defs,...o.scoring}};state.roster=state.roster.map(Number).filter(x=>P(x)).slice(0,60);state.watch=Array.isArray(state.watch)?state.watch.map(Number).filter(x=>P(x)):[];state.drafted=Array.isArray(state.drafted)?state.drafted.map(Number).filter(x=>P(x)):[];persist();render();toast("Imported settings")}catch(e){alert("Could not import this HoopIQ settings file")}};reader.readAsText(t.files[0])}
});
document.addEventListener("input",e=>{const t=e.target;if(window.HoopIQMatchup?.onInput(matchupCtx(),t))return;if(t.id==="waiverQuery"){const pos=t.selectionStart;state.waiverQuery=t.value;render();const el=$("waiverQuery");if(el){el.focus();el.setSelectionRange(pos,pos)}return}
if(t.id==="manualquery"){const caret=t.selectionStart;state.manualQuery=t.value;render();const field=$("manualquery");if(field){field.focus();field.setSelectionRange(caret,caret)}return}if(t.id==="playersearch"){const a=t.selectionStart;state.search=t.value;render();const input=$("playersearch");if(input){input.focus();input.setSelectionRange(a,a)}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.selected){state.selected=null;render()}});
window.addEventListener("hashchange",()=>{
 pendingPersonalRoster=window.HoopIQPersonalLink?.fromHash(window.location.hash)||null;
 personalRosterError="";personalRosterBusy=false;
 if(pendingPersonalRoster){state.view="league";window.scrollTo(0,0)}
 render();
});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
refreshCoachMode();updateNBA();updateScores();loadWeek();setInterval(updateNBA,20*60*1000);setInterval(updateScores,60*1000);
})();
</script></body></html>
